<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free EMI Calculator – Loan EMI Calculator Online</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f3f4f6;
  display: flex;
  min-height: 100vh;
  color: #111827;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: white;
  padding: 30px 20px;
  border-right: 1px solid #e5e7eb;
}

.sidebar h2 {
  margin-bottom: 30px;
  font-size: 18px;
}

.sidebar a {
  display: block;
  padding: 10px 12px;
  margin-bottom: 8px;
  text-decoration: none;
  color: #374151;
  border-radius: 8px;
  font-size: 14px;
}

.sidebar a:hover {
  background: #eef2ff;
  color: #4f46e5;
}

/* Main */
.main {
  flex: 1;
  padding: 40px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  max-width: 600px;
}

h1 {
  margin-bottom: 20px;
  font-size: 26px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #4f46e5;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #4338ca;
}

.result {
  margin-top: 20px;
  font-weight: 600;
  line-height: 1.6;
}

/* Responsive */
@media (max-width: 900px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #e5e7eb;
  }

  .main {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Calculator Tools</h2>
  <a href="index.html">🏠 Home</a>
  <a href="percentage-calculator.html">📊 Percentage</a>
  <a href="age-calculator.html">🎂 Age</a>
  <a href="gst-calculator.html">💰 GST</a>
  <a href="emi-calculator.html">🏦 EMI</a>
  <a href="word-counter.html">📝 Word Counter</a>
</div>

<div class="main">
  <div class="card">
    <h1>EMI Calculator</h1>

    <input type="number" id="loanAmount" placeholder="Loan Amount">
    <input type="number" id="interestRate" placeholder="Annual Interest Rate (%)">
    <input type="number" id="loanTenure" placeholder="Loan Tenure (Years)">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div class="result" id="result"></div>
  </div>
</div>

<script>
function calculateEMI() {
  let P = parseFloat(document.getElementById("loanAmount").value);
  let annualRate = parseFloat(document.getElementById("interestRate").value);
  let years = parseFloat(document.getElementById("loanTenure").value);

  if (!P || !annualRate || !years) {
    document.getElementById("result").innerText = "Please fill all fields.";
    return;
  }

  let r = annualRate / 12 / 100;
  let n = years * 12;

  let EMI = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
  let totalPayment = EMI * n;
  let totalInterest = totalPayment - P;

  document.getElementById("result").innerHTML =
    "Monthly EMI: " + EMI.toFixed(2) + "<br>" +
    "Total Interest: " + totalInterest.toFixed(2) + "<br>" +
    "Total Payment: " + totalPayment.toFixed(2);
}
</script>

</body>
</html>
